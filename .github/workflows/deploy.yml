# main 또는 작업 브랜치에 푸시되면 정적 빌드를 GitHub Pages로 배포합니다.
# configure-pages 의 enablement 로 Pages 가 꺼져 있으면 자동으로 켭니다(Source: GitHub Actions).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/ai-oil-painting-app-khyffc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
