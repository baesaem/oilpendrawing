<div style="width: 960px; height: 600px; position: relative; background: #1c1b19; color: #e8e4dc; overflow: hidden; font-size: 22px;">

  </div>

  <!-- 전체 캔버스 영역 -->
  <div style="position: absolute; left: 24px; top: 80px; right: 24px; bottom: 24px; border: 2px dashed #4a4640; border-radius: 6px; background: #242320; display: flex; align-items: center; justify-content: center;">

    </div>
  </div>

  <!-- 왼쪽 떠있는 패널 -->
  <div style="position: absolute; left: 44px; top: 100px; width: 200px; display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 2px solid #6b665e; border-radius: 6px; background: rgba(28,27,25,0.92);">
    <div style="font-size: 20px;">입력</div>
    <div style="height: 90px; border: 2px dashed #6b665e; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #9a948a; font-size: 18px;">원본 사진</div>
    <div style="height: 60px; border: 2px dashed #6b665e; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #9a948a; font-size: 18px;">견본 (선택)</div>
  </div>

  <!-- 오른쪽 떠있는 패널 -->
  <div style="position: absolute; right: 44px; top: 100px; width: 220px; display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 2px solid #6b665e; border-radius: 6px; background: rgba(28,27,25,0.92);">
    <div style="font-size: 20px;">표현</div>
    <div style="display: flex; gap: 4px;"><div style="flex: 1; height: 30px; border: 2px solid #6b665e; display: flex; align-items: center; justify-content: center; font-size: 18px;">초</div><div style="flex: 1; height: 30px; border: 2px solid #e0a35c; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #e0a35c;">중</div><div style="flex: 1; height: 30px; border: 2px solid #6b665e; display: flex; align-items: center; justify-content: center; font-size: 18px;">상</div></div>
    <div style="display: flex; flex-direction: column; gap: 4px;"><div style="font-size: 18px;">강도</div><div style="height: 3px; background: #4a4640; position: relative;"><div style="position: absolute; left: 60%; top: -5px; width: 13px; height: 13px; border-radius: 50%; background: #e0a35c;"></div></div></div>

  <!-- 하단 툴바 -->
  <div style="position: absolute; left: 50%; bottom: 44px; margin-left: -200px; width: 400px; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border: 2px solid #6b665e; border-radius: 999px; background: rgba(28,27,25,0.92);">
    <div style="font-size: 18px; color: #9a948a;">API 키 연결됨</div>
    <div style="font-size: 18px; color: #9a948a;">이력 이전 · 다음</div>
    <div style="height: 34px; padding: 0 18px; display: flex; align-items: center; border-radius: 999px; background: #e0a35c; color: #1c1b19; font-size: 20px;">생성</div>

</div>
