<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
  <style>
    body { margin: 0; font-family: 'Nanum Pen Script', 'Apple SD Gothic Neo', cursive, sans-serif; color: #2b2b2b; background: #ffffff; }
    a { color: #b5532a; } a:hover { color: #8f3f1e; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 960px; height: 600px; position: relative; background: #ffffff; color: #2b2b2b; overflow: hidden; font-size: 22px; display: flex; flex-direction: column; gap: 16px; padding: 12px 24px 24px;">

  <div style="display: flex; flex-direction: column; gap: 2px;">
    <div style="font-size: 30px; line-height: 1.2; white-space: nowrap;">대안 C · 단계형 위저드</div>
    <div style="font-size: 18px; color: #7a7a7a; line-height: 1.3;">한 화면에 한 가지 결정, 초보자용 흐름 · 장점: 헷갈릴 게 없음 · 단점: 설정을 바꿔 다시 그리는 반복이 느림</div>
  </div>

  <!-- 단계 표시 -->
  <div style="display: flex; align-items: center; gap: 0; padding: 0 40px;">
    <div style="display: flex; align-items: center; gap: 8px;"><div style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid #2b2b2b; background: #2b2b2b; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px;">1</div><div>원본 사진</div></div>
    <div style="flex: 1; height: 2px; background: #2b2b2b; margin: 0 12px;"></div>
    <div style="display: flex; align-items: center; gap: 8px;"><div style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid #2b2b2b; background: #2b2b2b; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px;">2</div><div>견본</div></div>
    <div style="flex: 1; height: 2px; background: #2b2b2b; margin: 0 12px;"></div>
    <div style="display: flex; align-items: center; gap: 8px;"><div style="width: 32px; height: 32px; border-radius: 50%; border: 3px solid #b5532a; color: #b5532a; display: flex; align-items: center; justify-content: center; font-size: 18px;">3</div><div style="color: #b5532a;">표현 설정</div></div>
    <div style="flex: 1; height: 2px; background: #cfcfcf; margin: 0 12px;"></div>
    <div style="display: flex; align-items: center; gap: 8px;"><div style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid #cfcfcf; color: #9a9a9a; display: flex; align-items: center; justify-content: center; font-size: 18px;">4</div><div style="color: #9a9a9a;">결과</div></div>
  </div>

  <!-- 단계 3 카드 -->
  <div style="flex: 1; display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; min-height: 0;">
    <div style="border: 2px solid #2b2b2b; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #fafafa;">
      <svg width="160" height="120" viewBox="0 0 200 140" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 120 L180 120"></path><path d="M60 118 C40 80 70 50 100 40 C130 50 160 80 140 118 Z"></path><path d="M100 40 C104 30 110 26 116 24"></path></svg>
      <div style="font-size: 18px; color: #7a7a7a;">미리보기 (작게, 설정 바꾸면 갱신)</div>
    </div>
    <div style="border: 2px solid #2b2b2b; border-radius: 8px; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; background: #fafafa;">
      <div style="font-size: 26px;">어떤 느낌으로 그릴까요?</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
        <div style="height: 92px; border: 2px solid #cfcfcf; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 4px;"><div>초급</div><div style="font-size: 16px; color: #7a7a7a;">윤곽선 위주, 선 적음</div></div>
        <div style="height: 92px; border: 3px solid #b5532a; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 4px;"><div style="color: #b5532a;">중급</div><div style="font-size: 16px; color: #7a7a7a;">해칭으로 명암 표현</div></div>
        <div style="height: 92px; border: 2px solid #cfcfcf; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 4px;"><div>상급</div><div style="font-size: 16px; color: #7a7a7a;">교차 해칭, 질감·반사광</div></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px;">
        <div style="display: flex; flex-direction: column; gap: 4px;"><div>강도</div><div style="height: 3px; background: #cfcfcf; position: relative;"><div style="position: absolute; left: 55%; top: -6px; width: 15px; height: 15px; border-radius: 50%; background: #b5532a;"></div></div></div>
        <div style="display: flex; flex-direction: column; gap: 4px;"><div>밝기</div><div style="height: 3px; background: #cfcfcf; position: relative;"><div style="position: absolute; left: 50%; top: -6px; width: 15px; height: 15px; border-radius: 50%; background: #b5532a;"></div></div></div>
        <div style="display: flex; gap: 8px; align-items: center;"><div>색</div><div style="padding: 0 10px; border: 2px solid #b5532a; color: #b5532a; font-size: 18px;">컬러</div><div style="padding: 0 10px; border: 2px solid #cfcfcf; font-size: 18px;">흑백</div></div>
        <div style="display: flex; gap: 8px; align-items: center;"><div>빛</div><div style="display: flex; gap: 4px;"><div style="width: 22px; height: 22px; border: 2px solid #cfcfcf;"></div><div style="width: 22px; height: 22px; border: 2px solid #b5532a; background: #b5532a;"></div><div style="width: 22px; height: 22px; border: 2px solid #cfcfcf;"></div><div style="width: 22px; height: 22px; border: 2px solid #cfcfcf;"></div></div><div style="font-size: 16px; color: #7a7a7a;">(8방향)</div></div>
      </div>
      <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 18px; color: #7a7a7a;">← 견본으로</div>
        <div style="height: 40px; padding: 0 22px; display: flex; align-items: center; border-radius: 6px; background: #b5532a; color: #fff;">다음: 그리기 →</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
