<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #2b2420; background: #f4eee3; -webkit-font-smoothing: antialiased; }
    a { color: #b5532a; } a:hover { color: #8f3f1e; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 720px; height: 640px; padding: 40px 48px; display: flex; flex-direction: column; gap: 24px; background: #f4eee3; color: #2b2420; overflow: hidden;">

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="font-size: 12px; color: #8a7b6e; letter-spacing: 0.08em;">시작하기 · 1/1</div>
    <div style="font-family: 'Nanum Myeongjo', 'Noto Serif KR', serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em; line-height: 1.3;">내 API 키로 그립니다</div>
    <div style="font-size: 14px; color: #5d5148; line-height: 1.6;">키는 이 브라우저에만 저장되고, 요청은 브라우저에서 제공사 API로 직접 보냅니다. 서버에 키가 저장되지 않습니다.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 13px; font-weight: 500;">이미지 생성 제공사</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 2px solid #2b2420; background: #faf6ee; font-size: 14px; font-weight: 700;">OpenAI 이미지</div>
      <div style="height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid #d9cfbd; background: #faf6ee; font-size: 14px; color: #5d5148;">Google Gemini 이미지</div>
      <div style="height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid #d9cfbd; background: #faf6ee; font-size: 14px; color: #5d5148;">Stability AI</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; justify-content: space-between; font-size: 13px;"><span style="font-weight: 500;">API 키</span><span style="color: #b5532a;">키 발급 안내</span></div>
    <div style="height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 6px; border: 1px solid #b9ab94; background: #fbf8f1;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a7b6e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3"></path></svg>
      <div style="flex: 1; font-size: 14px; letter-spacing: 0.18em; color: #2b2420;">sk-••••••••••••••••••••••••••••••••••••••••</div>
      <div style="font-size: 13px; color: #5d5148;">표시</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; justify-content: space-between; font-size: 13px;"><span style="font-weight: 500;">Claude API 키 <span style="color: #8a7b6e; font-weight: 400;">· 선택</span></span></div>
    <div style="height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 6px; border: 1px dashed #b9ab94; background: #f7f2e9;">
      <div style="flex: 1; font-size: 14px; color: #8a7b6e;">견본 이미지를 분석해 드로잉 지시문을 자동으로 다듬어 줍니다</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px;">
    <div style="width: 18px; height: 18px; border-radius: 4px; background: #2b2420; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f4eee3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></div>
    <div style="font-size: 13px; color: #2b2420;">이 기기에 기억하기</div>
    <div style="font-size: 12px; color: #8a7b6e;">· 공용 PC라면 끄세요</div>
  </div>

  <div style="margin-top: auto; display: flex; gap: 10px; justify-content: flex-end;">
    <div style="height: 48px; padding: 0 20px; display: flex; align-items: center; border-radius: 6px; border: 1px solid #d9cfbd; background: #faf6ee; font-size: 14px; color: #2b2420;">연결 확인</div>
    <div style="height: 48px; padding: 0 24px; display: flex; align-items: center; border-radius: 6px; background: #b5532a; color: #faf6ee; font-size: 14px; font-weight: 700;">저장하고 시작</div>
  </div>
</div>
</x-dc>
</body>
</html>
