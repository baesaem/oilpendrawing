<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #2b2420; background: #f4eee3; -webkit-font-smoothing: antialiased; }
    a { color: #b5532a; } a:hover { color: #8f3f1e; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f4eee3; color: #2b2420; overflow: hidden; position: relative;">

  <div style="height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #d9cfbd;">
    <div style="font-family: 'Nanum Myeongjo', 'Noto Serif KR', serif; font-weight: 800; font-size: 19px; letter-spacing: -0.02em;">오일펜 드로잉</div>
    <div style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid #d9cfbd; border-radius: 999px; background: #faf6ee; font-size: 12px; color: #5d5148;">
      <div style="width: 7px; height: 7px; border-radius: 50%; background: #3f8f5a;"></div>API 키
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 0; min-height: 0;">

    <div style="position: relative; height: 220px; flex: none; border-radius: 8px; overflow: hidden; background: #fbf8f1; box-shadow: 0 1px 0 #d9cfbd, 0 14px 30px -20px rgba(43,36,32,0.45);">
      <svg viewBox="0 0 350 220" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%;">
        <defs>
          <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9dcc4"></stop><stop offset="1" stop-color="#b9a688"></stop></linearGradient>
          <linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5e3c"></stop><stop offset="1" stop-color="#5a3a24"></stop></linearGradient>
          <radialGradient id="pear" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#d9c85a"></stop><stop offset="1" stop-color="#6f7a2c"></stop></radialGradient>
          <pattern id="hA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><line x1="0" y1="0" x2="0" y2="6" stroke="#3a2c22" stroke-width="0.9"></line></pattern>
          <pattern id="hB" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><line x1="0" y1="0" x2="0" y2="4.5" stroke="#2b2420" stroke-width="1"></line></pattern>
          <pattern id="cr" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)"><line x1="0" y1="0" x2="0" y2="5" stroke="#2b2420" stroke-width="0.8"></line></pattern>
          <clipPath id="L"><rect x="0" y="0" width="190" height="220"></rect></clipPath>
          <clipPath id="R"><rect x="190" y="0" width="160" height="220"></rect></clipPath>
        </defs>
        <g clip-path="url(#R)">
          <rect width="350" height="220" fill="url(#wall)"></rect>
          <rect x="0" y="146" width="350" height="74" fill="url(#table)"></rect>
          <path d="M200 146 C158 146 154 110 176 86 C190 70 194 54 204 46 C214 54 218 70 232 86 C254 110 242 146 200 146 Z" fill="url(#pear)"></path>
          <path d="M204 46 C206 36 212 30 218 28" stroke="#4a3b22" stroke-width="4" fill="none" stroke-linecap="round"></path>
          <ellipse cx="200" cy="148" rx="46" ry="7" fill="#2b1a10" opacity="0.35"></ellipse>
        </g>
        <g clip-path="url(#L)">
          <rect width="350" height="220" fill="#fbf8f1"></rect>
          <rect x="0" y="146" width="350" height="74" fill="url(#hA)" opacity="0.8"></rect>
          <rect x="0" y="146" width="350" height="74" fill="url(#cr)" opacity="0.5"></rect>
          <line x1="0" y1="146" x2="350" y2="146" stroke="#2b2420" stroke-width="1.4"></line>
          <path d="M200 146 C158 146 154 110 176 86 C190 70 194 54 204 46 C214 54 218 70 232 86 C254 110 242 146 200 146 Z" fill="#fbf8f1" stroke="#2b2420" stroke-width="1.6"></path>
          <path d="M200 146 C158 146 154 110 176 86 C190 70 194 54 204 46 C214 54 218 70 232 86 C254 110 242 146 200 146 Z" fill="url(#hB)" opacity="0.7"></path>
          <path d="M70 100 L82 146 L140 146 L152 100 Z" fill="#fbf8f1" stroke="#2b2420" stroke-width="1.6"></path>
          <path d="M120 102 L130 146 L140 146 L152 100 Z" fill="url(#hB)" opacity="0.7"></path>
          <ellipse cx="111" cy="100" rx="41" ry="8" fill="#fbf8f1" stroke="#2b2420" stroke-width="1.6"></ellipse>
          <ellipse cx="110" cy="150" rx="42" ry="5" fill="url(#cr)"></ellipse>
        </g>
        <line x1="190" y1="0" x2="190" y2="220" stroke="#f4eee3" stroke-width="3"></line>
        <circle cx="190" cy="110" r="14" fill="#f4eee3" stroke="#2b2420" stroke-width="1.4"></circle>
      </svg>
      <div style="position: absolute; left: 10px; top: 10px; padding: 3px 8px; border-radius: 4px; background: rgba(43,36,32,0.85); color: #f4eee3; font-size: 11px;">드로잉</div>
      <div style="position: absolute; right: 10px; top: 10px; padding: 3px 8px; border-radius: 4px; background: rgba(244,238,227,0.9); color: #2b2420; font-size: 11px;">원본</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; flex: none;">
      <div style="height: 76px; display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px dashed #b9ab94; border-radius: 6px; background: #f7f2e9;">
        <div style="width: 56px; height: 56px; flex: none; border-radius: 4px; background: linear-gradient(135deg, #e9dcc4, #8b5e3c);"></div>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;"><div style="font-size: 12px; font-weight: 700;">원본</div><div style="font-size: 11px; color: #6f6257;">컬러 · JPG</div><div style="font-size: 11px; color: #b5532a; font-weight: 500;">교체</div></div>
      </div>
      <div style="height: 76px; display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px dashed #b9ab94; border-radius: 6px; background: #f7f2e9;">
        <div style="width: 56px; height: 56px; flex: none; border-radius: 4px; background: #fbf8f1; border: 1px solid #d9cfbd; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a7b6e" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;"><div style="font-size: 12px; font-weight: 700;">견본</div><div style="font-size: 11px; color: #6f6257;">선택 사항</div></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; flex: none;">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 6px; background: #d9cfbd;">
        <div style="height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 13px; color: #5d5148;">초급</div>
        <div style="height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 13px; font-weight: 700; background: #faf6ee; box-shadow: 0 1px 2px rgba(43,36,32,0.15);">중급</div>
        <div style="height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 13px; color: #5d5148;">상급</div>
      </div>
      <div style="font-size: 11px; color: #6f6257; line-height: 1.5;">한 방향 해칭으로 중간톤을 넣고 주요 질감만 살립니다.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; flex: none;">
      <div style="display: flex; justify-content: space-between; font-size: 13px;"><span style="font-weight: 500;">강도</span><span style="color: #6f6257;">50</span></div>
      <div style="position: relative; height: 4px; border-radius: 2px; background: #cfc4b0;"><div style="position: absolute; left: 0; top: 0; height: 4px; width: 50%; border-radius: 2px; background: #b5532a;"></div><div style="position: absolute; left: 50%; top: -8px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: #faf6ee; border: 2px solid #b5532a;"></div></div>
    </div>

    <div style="display: flex; gap: 8px; flex: none;">
      <div style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 2px solid #2b2420; background: #faf6ee; font-size: 13px; font-weight: 700;">컬러</div>
      <div style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid #d9cfbd; background: #faf6ee; font-size: 13px; color: #5d5148;">흑백</div>
      <div style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid #d9cfbd; background: #faf6ee; font-size: 13px; color: #5d5148;">세피아</div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; flex: none;">
      <svg width="84" height="84" viewBox="0 0 132 132" style="flex: none;">
        <defs><radialGradient id="ball" cx="0.7" cy="0.28" r="0.75"><stop offset="0" stop-color="#fbf8f1"></stop><stop offset="0.7" stop-color="#8a7b6e"></stop><stop offset="1" stop-color="#3a2c22"></stop></radialGradient></defs>
        <circle cx="66" cy="66" r="60" fill="#faf6ee" stroke="#d9cfbd" stroke-width="1.5"></circle>
        <circle cx="66" cy="66" r="24" fill="url(#ball)"></circle>
        <circle cx="66" cy="12" r="5" fill="#cfc4b0"></circle><circle cx="120" cy="66" r="5" fill="#cfc4b0"></circle><circle cx="104" cy="104" r="5" fill="#cfc4b0"></circle><circle cx="66" cy="120" r="5" fill="#cfc4b0"></circle><circle cx="28" cy="104" r="5" fill="#cfc4b0"></circle><circle cx="12" cy="66" r="5" fill="#cfc4b0"></circle><circle cx="28" cy="28" r="5" fill="#cfc4b0"></circle>
        <circle cx="104" cy="28" r="9" fill="#b5532a" stroke="#faf6ee" stroke-width="3"></circle>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 13px; font-weight: 500;">빛의 방향</div>
        <div style="font-size: 18px; font-family: 'Nanum Myeongjo', serif; font-weight: 700;">우상단</div>
        <div style="font-size: 11px; color: #6f6257;">원판을 돌려 선택</div>
      </div>
      <div style="margin-left: auto; display: flex; flex-direction: column; gap: 10px; width: 120px;">
        <div style="display: flex; flex-direction: column; gap: 6px;"><div style="display: flex; justify-content: space-between; font-size: 12px;"><span>밝기</span><span style="color: #6f6257;">0</span></div><div style="position: relative; height: 4px; border-radius: 2px; background: #cfc4b0;"><div style="position: absolute; left: 50%; top: -5px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #faf6ee; border: 2px solid #b5532a;"></div></div></div>
        <div style="display: flex; flex-direction: column; gap: 6px;"><div style="display: flex; justify-content: space-between; font-size: 12px;"><span>대비</span><span style="color: #6f6257;">0</span></div><div style="position: relative; height: 4px; border-radius: 2px; background: #cfc4b0;"><div style="position: absolute; left: 50%; top: -5px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #faf6ee; border: 2px solid #b5532a;"></div></div></div>
      </div>
    </div>
  </div>

  <div style="flex: none; padding: 12px 20px 20px; background: linear-gradient(to bottom, rgba(244,238,227,0), #f4eee3 30%);">
    <div style="height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 6px; background: #b5532a; color: #faf6ee; font-size: 15px; font-weight: 700;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#faf6ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.6 7.6"></path></svg>
      드로잉 생성
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
